<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spots is a responsive photo-sharing profile page."
    />
    <meta name="author" content="Eric" />
    <meta
      name="keywords"
      content="Spots, photo sharing, responsive design, TripleTen"
    />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img class="header__logo" src="./images/logo.svg" alt="Spots logo" />
      </header>

      <main class="content">
        <section class="profile">
          <div class="profile__avatar-container">
            <img
              class="profile__avatar"
              src="./images/avatar.jpg"
              alt="Bessie Coleman"
            />
            <button
              class="profile__avatar-edit-btn"
              type="button"
              aria-label="Edit avatar"
            >
              <img
                class="profile__avatar-edit-icon"
                src="./images/edit-icon.svg"
                alt=""
              />
            </button>
          </div>

          <div class="profile__info">
            <h1 class="profile__title">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>

            <button class="profile__edit-btn" type="button">
              <img
                class="profile__edit-icon"
                src="./images/edit-icon.svg"
                alt="Edit icon"
              />
              Edit Profile
            </button>
          </div>

          <button class="profile__add-btn" type="button">+ New Post</button>
        </section>
        <section class="cards">
          <ul class="cards__list"></ul>
        </section>
      </main>

      <footer class="footer">
        <p class="footer__copyright">2024 © Spots</p>
      </footer>
    </div>
    <template id="card-template">
      <li class="card">
        <img class="card__image" alt="" />
        <button
          class="card__delete-btn"
          type="button"
          aria-label="Delete card"
        ></button>
        <div class="card__content">
          <h2 class="card__title"></h2>
          <button
            class="card__like-btn"
            type="button"
            aria-label="Like card"
          ></button>
        </div>
      </li>
    </template>
    <div class="modal" id="edit-profile-modal">
      <div class="modal__container">
        <button
          class="modal__close-btn"
          type="button"
          aria-label="Close edit profile form"
        >
          <img class="modal__close-icon" src="./images/close-icon.svg" alt="" />
        </button>

        <h2 class="modal__title">Edit profile</h2>

        <form class="modal__form" name="edit-profile" novalidate>
          <label class="modal__label">
            Name
            <input
              class="modal__input"
              type="text"
              name="name"
              value="Bessie Coleman"
              required
              minlength="2"
              maxlength="40"
              aria-describedby="name-error"
            />
            <span
              class="modal__error"
              id="name-error"
              aria-live="polite"
            ></span>
          </label>

          <label class="modal__label">
            Description
            <input
              class="modal__input"
              type="text"
              name="description"
              value="Civil Aviator"
              required
              minlength="2"
              maxlength="200"
              aria-describedby="description-error"
            />
            <span
              class="modal__error"
              id="description-error"
              aria-live="polite"
            ></span>
          </label>

          <button class="modal__submit-btn" type="submit">Save</button>
        </form>
      </div>
    </div>
    <div class="modal" id="new-post-modal">
      <div class="modal__container">
        <button
          class="modal__close-btn"
          type="button"
          aria-label="Close new post form"
        >
          <img class="modal__close-icon" src="./images/close-icon.svg" alt="" />
        </button>

        <h2 class="modal__title">New post</h2>

        <form class="modal__form" name="new-post" novalidate>
          <label class="modal__label">
            Image Link
            <input
              class="modal__input"
              type="url"
              name="image-link"
              placeholder="Image URL"
              required
              aria-describedby="image-link-error"
            />
            <span
              class="modal__error"
              id="image-link-error"
              aria-live="polite"
            ></span>
          </label>

          <label class="modal__label">
            Caption
            <input
              class="modal__input"
              type="text"
              name="caption"
              placeholder="Caption"
              required
              minlength="2"
              maxlength="30"
              aria-describedby="caption-error"
            />
            <span
              class="modal__error"
              id="caption-error"
              aria-live="polite"
            ></span>
          </label>

          <button class="modal__submit-btn" type="submit">Save</button>
        </form>
      </div>
    </div>
    <div class="modal" id="edit-avatar-modal">
      <div class="modal__container">
        <button
          class="modal__close-btn"
          type="button"
          aria-label="Close edit avatar form"
        >
          <img class="modal__close-icon" src="./images/close-icon.svg" alt="" />
        </button>

        <h2 class="modal__title">Edit avatar</h2>

        <form class="modal__form" name="edit-avatar" novalidate>
          <label class="modal__label">
            Profile picture
            <input
              class="modal__input"
              type="url"
              name="avatar"
              placeholder="Image URL"
              required
              aria-describedby="avatar-error"
            />
            <span
              class="modal__error"
              id="avatar-error"
              aria-live="polite"
            ></span>
          </label>

          <button class="modal__submit-btn" type="submit">Save</button>
        </form>
      </div>
    </div>
    <div class="modal" id="delete-card-modal">
      <div class="modal__container modal__container_type_delete">
        <button
          class="modal__close-btn"
          type="button"
          aria-label="Close delete confirmation"
        >
          <img class="modal__close-icon" src="./images/close-icon.svg" alt="" />
        </button>

        <h2 class="modal__title">Are you sure?</h2>

        <form class="modal__form" name="delete-card" novalidate>
          <button class="modal__submit-btn" type="submit">Delete</button>
        </form>
      </div>
    </div>
    <div class="modal" id="preview-modal">
      <div class="modal__preview-container">
        <button
          class="modal__close-btn"
          type="button"
          aria-label="Close preview"
        >
          <img
            class="modal__close-icon"
            src="./images/close-icon-white.svg"
            alt=""
          />
        </button>

        <img class="modal__preview-image" src="./images/avatar.jpg" alt="" />
        <p class="modal__preview-caption"></p>
      </div>
    </div>
  </body>
</html>
